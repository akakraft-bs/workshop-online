apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: akakraft-db
  namespace: akakraft-prod
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:17.2

  postgresql:
    parameters:
      max_connections: "100"
      shared_buffers: "128MB"

  bootstrap:
    initdb:
      database: akakraft
      owner: akakraft
      secret:
        name: akakraft-db-credentials

  storage:
    storageClass: local-path
    size: 10Gi

  # Backups über das Barman-Cloud-Plugin auf nas-03 (siehe objectstore.yaml)
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: nas03-store

  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "500m"
