apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: akakraft-db
  namespace: akakraft
spec:
  instances: 1

  postgresql:
    parameters:
      max_connections: "100"
      shared_buffers: "128MB"

  bootstrap:
    initdb:
      database: akakraft
      owner: akakraft
      secret:
        name: akakraft-db-credentials   # type: kubernetes.io/basic-auth

  storage:
    storageClass: local-path
    size: 5Gi

  # Kein Backup für Staging. Geplant: regelmäßiger Refresh aus den Prod-Backups auf nas-03.

  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "500m"
