apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: akakraft-managed-secret
  namespace: akakraft-stag
spec:
  hostAPI: https://app.infisical.com/api
  resyncInterval: 60
  authentication:
    universalAuth:
      credentialsRef:
        secretName: infisical-universal-auth-credentials
        secretNamespace: akakraft-stag
      secretsScope:
        projectSlug: akakraft-online-h6-kr
        envSlug: staging
        secretsPath: /
  managedSecretReference:
    secretName: akakraft-secrets
    secretNamespace: akakraft-stag
    creationPolicy: Orphan
---
