---
apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: ghcr-pull-managed-secret
  namespace: akakraft-stag
spec:
  hostAPI: https://app.infisical.com/api
  resyncInterval: 60
  authentication:
    universalAuth:
      credentialsRef:
        secretName: infisical-universal-auth-credentials
        secretNamespace: akakraft-stag
      secretsScope:
        projectSlug: akakraft-online-h6-kr
        envSlug: staging
        secretsPath: /ghcr/
  managedSecretReference:
    secretName: ghcr-pull-secret
    secretNamespace: akakraft-stag
    creationPolicy: Orphan
    secretType: kubernetes.io/dockerconfigjson
    template:
      includeAllSecrets: false
      data:
        .dockerconfigjson: "{{ .DOCKERCONFIGJSON.Value }}"
